<main class="home-main"><p class="eyebrow">Histórico do cliente</p><h1>Ocorrências</h1><p class="intro">Registre acidentes, incidentes e observações da empresa.</p>
<section class="admin-panel"><label for="client-picker">Cliente</label><select id="client-picker"><option value="">Selecione uma empresa</option></select><p id="status" role="status"></p></section>
<div id="client-content" hidden><div class="occ-heading"><h2>Histórico de ocorrências</h2><button id="new-occurrence" class="primary-button">+ Nova ocorrência</button></div>
<form id="occ-form" class="admin-panel" hidden><h2>Nova ocorrência</h2><fieldset id="occ-fields"><div class="occ-grid"><label>Tipo *<select name="kind" required><option value="">Selecione</option><option>Acidente</option><option>Incidente</option><option>Observação</option></select></label><label>Data da ocorrência *<input name="occurred_on" type="date" required></label></div><label>Descrição *<textarea name="description" rows="5" maxlength="5000" required placeholder="Descreva o que aconteceu, o local e as providências tomadas."></textarea></label><label>Foto (opcional)<input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><small>JPG, PNG ou WebP · até 20 MB</small><div class="occ-actions"><button class="primary-button" type="submit">Salvar ocorrência</button><button id="cancel-occurrence" type="button" class="secondary-button">Cancelar</button></div></fieldset><p id="save-status" role="status"></p></form>
<div id="occ-list"></div><button id="more" class="secondary-button" hidden>Carregar mais</button><button id="retry-list" class="secondary-button" hidden>Tentar novamente</button></div></main></div></body></html>
