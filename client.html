<!doctype html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://vjtzragdciexixjzeann.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Cliente · GRO</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./home.css"><link rel="stylesheet" href="./client.css">
<script src="./vendor/supabase-2.117.2.js" defer></script><script type="module" src="./client.js"></script></head>
<body><header class="client-header"><a class="brand" href="./inicio.html"><strong>GRO</strong></a><a href="./inicio.html?view=clients">← Voltar aos clientes</a></header>
<main class="client-main"><section id="loading" role="status"><p>Carregando cadastro…</p><button id="retry" class="secondary-button" hidden>Tentar novamente</button></section>
<section id="content" hidden><p class="eyebrow">Área da equipe / Clientes</p><h1 id="page-title">Novo cliente</h1><p class="intro" id="page-description">Cadastre a empresa para organizar os próximos levantamentos.</p>
<form id="client-form"><p class="required-note">* Campo obrigatório. Os demais podem ser preenchidos depois.</p>
<fieldset id="fields"><section class="form-section"><h2>Dados da empresa</h2><div class="field-grid">
<label class="wide">Razão social *<input name="legal_name" required maxlength="240" autocomplete="organization"></label>
<label>Nome fantasia<input name="trade_name" maxlength="240"></label>
<label>CNPJ<input name="cnpj" maxlength="18" placeholder="00.000.000/0000-00" aria-describedby="cnpj-help"><small id="cnpj-help">Informe o CNPJ completo, se disponível.</small></label>
<label>CNAE principal<input name="cnae" maxlength="9" placeholder="0000-0/00"></label>
</div></section>
<section class="form-section"><h2>Endereço</h2><div class="field-grid">
<label>CEP<input name="postal_code" maxlength="9" autocomplete="postal-code" inputmode="numeric" placeholder="00000-000"></label>
<label>UF<select name="state"><option value="">Selecione</option></select></label>
<label class="wide">Rua / avenida<input name="street" maxlength="240" autocomplete="address-line1"></label>
<label>Número<input name="number" maxlength="30" placeholder="Ex.: 120 ou s/n"></label>
<label>Complemento<input name="complement" maxlength="160" autocomplete="address-line2"></label>
<label>Bairro<input name="district" maxlength="160"></label>
<label>Cidade<input name="city" maxlength="160" autocomplete="address-level2"></label>
</div></section>
<section class="form-section"><h2>Contato do responsável</h2><div class="field-grid">
<label class="wide">Nome do responsável<input name="contact_name" maxlength="160" autocomplete="name"></label>
<label>Telefone / WhatsApp<input name="contact_phone" type="tel" maxlength="30" autocomplete="tel" placeholder="(00) 00000-0000"></label>
<label>E-mail<input name="contact_email" type="email" maxlength="254" autocomplete="email"></label>
</div></section></fieldset>
<p id="feedback" role="status" tabindex="-1"></p><div class="form-actions"><button id="save" class="primary-button" type="submit">Salvar cliente</button><button id="edit" class="primary-button" type="button" hidden>Editar cadastro</button><button id="cancel" class="secondary-button" type="button" hidden>Cancelar edição</button><a href="./inicio.html?view=clients">Voltar aos clientes</a></div>
</form></section></main></body></html>
