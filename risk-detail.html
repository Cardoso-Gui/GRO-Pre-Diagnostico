<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detalhamento dos riscos · GRO</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f6f6;color:#203e49;font:15px/1.5 'Segoe UI',sans-serif}header{padding:17px 5%;background:#123542;color:white;display:flex;justify-content:space-between}header small{color:#b6d8d3}main{max-width:1060px;margin:38px auto;padding:0 24px}.eyebrow{color:#137b68;font-size:11px;font-weight:700;letter-spacing:1.7px}h1{font-size:32px;letter-spacing:-.7px;margin:8px 0}p{color:#6c818a;margin:8px 0 24px}.context{background:#123542;color:white;border-radius:13px;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;margin:28px 0}.context small{display:block;color:#b4d7d1;font-size:12px;margin-bottom:4px}.context strong{font-size:20px}.context span{font-size:12px;color:#cee4e2}.layout{display:grid;grid-template-columns:215px 1fr;gap:24px}nav{align-self:start;position:sticky;top:20px}nav p{font-size:11px;letter-spacing:1px;font-weight:600}nav button{display:block;width:100%;text-align:left;margin:10px 0;padding:15px;border-radius:9px;border:1px solid #dce5e7;background:white;color:#294752;font:inherit;cursor:pointer}nav button.active{border-color:#238670;background:#e7f2ed}nav small{display:block;font-size:11px;color:#79918a;margin-top:5px}article{background:white;border:1px solid #dce5e7;border-radius:14px;overflow:hidden}.card-head{padding:24px;border-bottom:1px solid #e5eded;display:flex;justify-content:space-between;gap:15px}h2{margin:8px 0 0;font-size:23px}.tag{font-size:11px;color:#287862;background:#eaf5ef;padding:5px 9px;border-radius:6px}.status{font-size:11px;color:#71848d;white-space:nowrap}.section{padding:24px;border-bottom:1px solid #edf1f2}h3{font-size:15px;margin:0 0 18px;display:flex;align-items:center;gap:10px}h3 span{font-size:11px;background:#edf5f3;border-radius:6px;padding:4px 8px;color:#387b6b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.wide{grid-column:1/-1}label{display:block;font-size:12px;font-weight:600;color:#5a737f}input,textarea,select{display:block;width:100%;margin-top:8px;padding:11px 12px;background:#fbfcfd;border:1px solid #d7e2e6;border-radius:8px;color:#294752;font:14px 'Segoe UI',sans-serif}textarea{min-height:80px;resize:vertical}::placeholder{color:#99a8af;opacity:1}.hint{font-size:12px;color:#85959d;margin:7px 0 0}.choices{display:flex;flex-wrap:wrap;gap:10px}.choices label{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#f7faf9;border:1px solid #dce7e3;border-radius:8px;font-weight:400}.choices input{width:16px;height:16px;margin:0;accent-color:#137b68}.section:last-child{border:0}.bottom{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:24px 0}.bottom button{padding:13px 18px;border:0;border-radius:9px;background:#137b68;color:white;font:600 14px 'Segoe UI';cursor:pointer}.bottom small{color:#6d828c}.notice{font-size:12px;color:#738790;border:1px dashed #c9d9dc;border-radius:9px;padding:14px;margin:26px 0}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #8dcaba;outline-offset:2px}[hidden]{display:none!important}@media(max-width:700px){main{padding:0 16px;margin-top:24px}.layout{grid-template-columns:1fr}nav{position:static;display:flex;gap:10px;overflow:auto}nav p{display:none}nav button{min-width:150px}.grid{grid-template-columns:1fr}.context{align-items:flex-start;gap:14px;flex-direction:column}.card-head,.section{padding:19px}h1{font-size:27px}.bottom{align-items:flex-start;flex-direction:column}}</style><header><strong>GRO / Levantamento</strong><a id="back" href="levantamento.html" style="color:white">← Voltar ao levantamento</a></header><main><div class="eyebrow">ETAPA 05 · EXPOSIÇÃO E PREVENÇÃO</div><h1>Detalhamento dos riscos</h1><p>Descreva como o risco aparece no trabalho e o que já é feito para controlá-lo.</p><p id="message" role="status">Verificando acesso…</p><div id="editor" hidden><div class="context"><div><small id="target-mode"></small><strong id="target-title"></strong><small id="target-description"></small></div><select id="target-select" aria-label="Cargo ou GHE" style="max-width:340px"></select></div><div class="layout"><nav id="risk-nav" aria-label="Riscos selecionados"></nav><div id="cards"></div></div><div class="bottom"><small>Salve o detalhamento antes de sair.</small><button id="save">Salvar detalhamento</button><button id="next">Próximo risco →</button></div></div></main><template id="detail-template"><div class="card-head"><div><span class="tag"> ·  · GRO complementar</span><h2></h2></div><span class="status"></span></div><div class="section"><h3><span>01</span>Como acontece a exposição?</h3><div class="grid"><label class="wide">Fonte ou situação de exposição<textarea data-field="source" placeholder="Onde e como a pessoa entra em contato com esse risco?"></textarea></label><label>Frequência<select data-field="frequency"><option value="">Selecione</option><option>Diária</option><option>Semanal</option><option>Eventual</option><option>Outra — descrever abaixo</option></select></label><label>Tempo ou circunstância de exposição<input data-field="duration" placeholder="Ex.: em cada entrada na câmara fria"></label></div><p class="hint"></p></div><div class="section"><h3><span>02</span>Possíveis danos à saúde</h3><label>O que pode acontecer?<textarea data-field="damage" placeholder="Descreva as possíveis lesões ou agravos relacionados à situação."></textarea></label></div><div class="section"><h3><span>03</span>O que já existe para proteger?</h3><div class="choices"><label><input type="checkbox">Proteção coletiva</label><label><input type="checkbox">Procedimentos e organização</label><label><input type="checkbox">EPI</label></div><label style="margin-top:18px">Descreva as medidas existentes<textarea data-field="measures" placeholder="Quais proteções, procedimentos ou equipamentos são utilizados?"></textarea></label><p class="hint">Marque somente medidas que já existem no local.</p><div class="grid" style="margin-top:18px"><label>EPI aplicável a este risco?<select id="detail-epi-applicable"><option value="">Selecione</option><option>Sim</option><option>Não</option></select></label><label id="detail-epi-label">Quais EPIs?<textarea id="detail-epi-items" maxlength="4000" placeholder="Um equipamento por linha"></textarea></label></div></div><div class="section"><h3><span>04</span>O que precisa melhorar?</h3><label>Observações e melhorias propostas<textarea data-field="improve" placeholder="Registre o que precisa ser verificado, corrigido ou implantado."></textarea></label><p class="hint">Responsáveis e prazos serão definidos no plano de ação.</p><label style="margin-top:18px">Precisa medir/avaliar?<select data-field="measure"><option value="">Selecione</option><option>Sim</option><option>Não</option></select></label><p class="hint">Ao marcar Sim, este risco aparecerá nas pendências para validação técnica do relatório.</p></div></template><script src="vendor/supabase-2.117.2.js"></script><script src="esocial-risk-table.js"></script><script src="occupational-risk-table.js"></script><script type="module" src="risk-detail.js"></script></html>
